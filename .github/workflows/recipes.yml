# Runs every recipe on each change and once a night, against two NanoIDPs:
# the release requirements.txt installs, which is what a reader gets, and the
# main branch, so a change there that breaks a recipe is noticed before it is
# released. The run on main goes through run-recipes.yml, the procedure
# NanoIDP's own CI calls on its pull requests, so that file is exercised here.
name: Recipes

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: recipes (release)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pip show nanoidp | head -2
      - run: pytest -v

  main:
    name: recipes (main)
    uses: ./.github/workflows/run-recipes.yml
    with:
      nanoidp-repository: cdelmonte-zg/nanoidp
      nanoidp-ref: main
      recipes-ref: ${{ github.sha }}

  # What a project takes away has to pass away from this repository: each
  # recipe folder with the root conftest.py and nothing else, installed with
  # the line the README of role-revoked-on-refresh gives. That folder
  # carries its own copy of conftest.py, which has to be the root one.
  standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The bundled conftest.py is the root one
        run: cmp conftest.py recipes/role-revoked-on-refresh/conftest.py
      - name: Install what the README names
        run: |
          line=$(grep -m1 '^pip install ' recipes/role-revoked-on-refresh/README.md)
          echo "$line"
          eval "$line"
      - name: Run each recipe from a folder of its own
        run: |
          for recipe in recipes/*/; do
            name=$(basename "$recipe")
            cp -r "$recipe" "$RUNNER_TEMP/$name"
            cp -n conftest.py "$RUNNER_TEMP/$name/"
            echo "::group::$name"
            (cd "$RUNNER_TEMP/$name" && pytest -v)
            echo "::endgroup::"
          done
