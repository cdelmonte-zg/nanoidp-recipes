# Runs every recipe on each change and once a night, against two NanoIDPs:
# the release requirements.txt installs, which is what a reader gets, and the
# main branch, so a change there that breaks a recipe is noticed before it is
# released.
name: Recipes

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recipes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        nanoidp: [release, main]
    name: recipes (${{ matrix.nanoidp }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - if: matrix.nanoidp == 'main'
        # Forced: main can carry the same version number as the release
        run: pip install --force-reinstall "nanoidp @ git+https://github.com/cdelmonte-zg/nanoidp@main"
      - if: matrix.nanoidp == 'main'
        run: pip freeze | grep -i "^nanoidp"
      - run: pip show nanoidp | head -2
      - run: pytest -v

  # role-revoked-on-refresh is the recipe a project takes away: it has to
  # pass with nothing but its own folder, and with the install line its
  # README gives.
  standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Take the folder alone
        run: cp -r recipes/role-revoked-on-refresh "$RUNNER_TEMP/recipe"
      - name: Install what its README names
        run: |
          line=$(grep -m1 '^pip install ' recipes/role-revoked-on-refresh/README.md)
          echo "$line"
          eval "$line"
      - run: pytest -v
        working-directory: ${{ runner.temp }}/recipe
