# The NanoIDP configuration this recipe needs: one confidential client, the
# application under test. NanoIDP gives every client the password and the
# refresh grant, so the client needs no more than its id and its secret.
config_version: 1

server:
  host: "127.0.0.1"
  port: 8000

oauth:
  # What the tokens carry as `iss`. Keep it equal to the address the
  # application reaches NanoIDP at
  issuer: "http://localhost:8000"
  clients:
    - client_id: "my-app"
      client_secret: "my-app-secret"
      description: "The application under test"
