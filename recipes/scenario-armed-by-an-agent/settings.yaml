# The NanoIDP configuration of this recipe: one confidential client, and a
# runtime store that a second process can share. Without the `runtime`
# block the store lives in the memory of the server alone, and the MCP
# server refuses the scenario tools.
config_version: 1

server:
  host: "127.0.0.1"
  port: 8000

oauth:
  # What the tokens carry as `iss`. Keep it equal to the address the
  # application reaches NanoIDP at
  issuer: "http://localhost:8000"
  clients:
    - client_id: "my-app"
      client_secret: "my-app-secret"
      description: "The application under test"

runtime:
  store: sqlite
  # Relative to this directory, and outside it: NanoIDP refuses a store
  # inside its configuration directory
  path: ../state/runtime.db
